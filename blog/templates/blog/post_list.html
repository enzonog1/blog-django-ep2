{% extends 'base.html' %}
{% block title %}Posts{% endblock %}
{% block content %}
<h1>Posts</h1>
{% if posts %}
<ul class="posts">
  {% for post in posts %}
  <li>
    <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
    <small>{{ post.posted_at|date:"d/m/Y H:i" }}</small>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>Nenhum post por aqui ainda. <a href="{% url 'post_create' %}">Crie o primeiro</a>.</p>
{% endif %}
{% endblock %}
