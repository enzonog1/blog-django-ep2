<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfólio do Titio Avô{% endblock %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333333;
    }
    header {
      background-color: #ffeb3b;
      padding: 20px;
      border-bottom: 3px solid #333333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: #222222;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    nav {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      font-weight: bold;
      color: #d32f2f;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    h1, h2, h3 {
      margin-bottom: 15px;
      color: #222222;
    }
    p {
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .meta {
      color: #555555;
      font-size: 0.9rem;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin-bottom: 10px;
    }
    article, .comment {
      border: 2px solid #333333;
      padding: 15px;
      border-radius: 10px;
      background-color: #e0f7fa;
      margin-bottom: 15px;
    }
    .comment {
      background-color: #ffffff;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      max-width: 600px;
      padding: 8px;
      border: 1px solid #333333;
      border-radius: 5px;
      box-sizing: border-box;
    }
    textarea {
      height: 160px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      background-color: #d32f2f;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #b71c1c;
    }
    footer {
      background-color: #333333;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'post_list' %}">
      <img src="https://raw.githubusercontent.com/enzonog1/blog-django-ep2/main/static/images/titio-avo.png" alt="Titio Avô" style="height:48px; width:auto;">
      <span>Portfólio do Titio Avô</span>
    </a>
    <nav>
      <a href="{% url 'post_list' %}">Posts</a>
      <a href="{% url 'post_create' %}">Novo post</a>
      <a href="{% url 'category_list' %}">Categorias</a>
      {% if user.is_authenticated %}
        <span>Olá, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button type="submit" style="margin-top:0; padding:4px 10px;">Sair</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p style="margin:0;">Trailer Mágico - 2026</p>
  </footer>
</body>
</html>
