{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1>Entrar</h1>
{% if form.errors %}<p class="error">Usuário ou senha incorretos.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
