<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %} | Meu Blog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 0 1rem 3rem; line-height: 1.55; color: #222; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    header .brand { font-weight: 700; font-size: 1.25rem; text-decoration: none; color: #222; margin-right: auto; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    a { color: #0b5cad; }
    .meta, small { color: #666; }
    .posts li { margin-bottom: .6rem; }
    .comment { border-left: 3px solid #ddd; padding-left: .8rem; margin: 1rem 0; }
    form.inline { display: inline; }
    form.inline button { background: none; border: 0; padding: 0; color: #0b5cad; text-decoration: underline; cursor: pointer; font: inherit; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'post_list' %}">Meu Blog</a>
    <nav>
      <a href="{% url 'post_list' %}">Posts</a>
      <a href="{% url 'post_create' %}">Novo post</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
